# =============================================================================
# WILLAQ — despliegue en Railway (Nixpacks)
#
# WILLAQ es PHP puro sin Composer: no hay vendor/ ni build step. Nixpacks solo
# necesita saber qué extensiones cargar y cómo arrancar el servidor.
#
# Extensiones REQUERIDAS (ver views/admin/panel.php):
#   pdo_pgsql -> cuentas de usuario e historial de alertas (Neon)
#   curl      -> Open-Meteo (models/Clima.php)
#   mbstring  -> texto en español
#   zip       -> scripts/inei_poblacion_xlsx_a_csv.php
#   simplexml -> lectura de XLSX en el importador
# =============================================================================

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo_pgsql",
  "php83Extensions.pdo_mysql",
  "php83Extensions.curl",
  "php83Extensions.mbstring",
  "php83Extensions.zip",
  "php83Extensions.simplexml",
  "php83Extensions.openssl",
  "php83Extensions.tokenizer",
]

[phases.install]
# Sin dependencias que instalar: no hay Composer ni package.json.
cmds = ["echo 'WILLAQ: sin dependencias externas'"]

[start]
# Railway inyecta $PORT. El router de PHP sirve index.php y los estáticos
# de assets/ directamente (php -S resuelve archivos existentes antes de
# invocar el router).
cmd = "php -S 0.0.0.0:${PORT:-8080} -t ."
